# Lint settings for the Python in scripts/, tests/ and examples/, used by lint.sh
target-version = "py311"
# The helpers import each other from scripts/, so count those modules as first-party
src = [".", "scripts"]

[lint]
# pyflakes, pycodestyle, bugbear, import sorting
select = ["F", "E", "W", "B", "I"]
# Long lines are fine; the helpers build long command strings
ignore = ["E501"]
