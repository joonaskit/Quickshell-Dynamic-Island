; qmllint settings, used by lint.sh. Keys not listed keep qmllint's defaults.
[General]
; Any warning fails the lint
MaxWarnings=0

[Warnings]
; Delegates read ids from outer components throughout the codebase. Fix file by
; file (pragma ComponentBehavior: Bound + required properties), then re-enable.
UnqualifiedAccess=disable
; qmllint doesn't know Quickshell's PanelWindow is creatable
UncreatableType=disable
; Quickshell's Process.exited uses QProcess::ExitStatus, which qmllint cannot resolve
BadSignalHandlerParameters=disable
UnusedImports=warning
